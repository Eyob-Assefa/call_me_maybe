[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained decoding function calling engine"
readme = "README.md"
authors = [
    { name = "Eyob-Assefa", email = "assefaeyob21@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.14.3",
]

[project.scripts]
call-me-maybe = "call_me_maybe:main"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
]
